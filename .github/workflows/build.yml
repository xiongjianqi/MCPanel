name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Maven 打包
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: mvn package
        run: mvn -B -DskipTests package

      - name: 上传 jar 产物
        uses: actions/upload-artifact@v4
        with:
          name: mc-panel
          path: target/mc-panel.jar
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: mc-panel
          path: dist

      - name: 列出产物
        run: ls -l dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mc-panel.jar
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'Alpha') }}
